absent:
  reso_data_dictionary: >-
    No RESO Data Dictionary terms are used. RESO has no UK presence and Foxtons carries no
    certification.
  uprn: >-
    No Ordnance Survey UPRN is published, so listings cannot be joined to the UK's
    canonical address register without geocoding.
  epc: >-
    No EPC rating term appears in the structured data. EPC and council-tax information is
    referenced in the page's rendered copy and disclaimers only, so the UK's two standard
    property disclosures are not machine-readable from Foxtons' markup.
