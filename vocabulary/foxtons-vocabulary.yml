  usage: Corporate identity on the homepage (legalName "Foxtons Limited").
- term: RealEstateAgent
  uri: https://schema.org/RealEstateAgent
  usage: The selling/letting agent on every listing, and the site-level business identity.
- term: LocalBusiness
  uri: https://schema.org/LocalBusiness
  usage: Co-typed with RealEstateAgent in the site @graph.
- term: House
  uri: https://schema.org/House
  usage: The property being sold or let. Co-typed with Product.
- term: Product
  uri: https://schema.org/Product
  usage: Co-typing that lets a listing carry offers and be treated commercially.
- term: Offer
  uri: https://schema.org/Offer
  usage: The commercial offer attached to a listing, and the services on the homepage.
- term: PriceSpecification
  uri: https://schema.org/PriceSpecification
  usage: Asking price (sale) or monthly rent (let), always GBP.
- term: PostalAddress
  uri: https://schema.org/PostalAddress
  usage: Property address and the Chiswick Park head office.
- term: GeoCoordinates
  uri: https://schema.org/GeoCoordinates
  usage: Latitude/longitude on every listing.
- term: QuantitativeValue
  uri: https://schema.org/QuantitativeValue
  usage: floorSize, expressed with unitCode MTK.
- term: AggregateRating
  uri: https://schema.org/AggregateRating
  usage: Company-level review score on the homepage.
- term: Service
  uri: https://schema.org/Service
  usage: The three offered services — valuation, sales, lettings.
- term: WebSite
  uri: https://schema.org/WebSite
  usage: Site identity in the page @graph.
- term: WebPage
  uri: https://schema.org/WebPage
  usage: Page identity and breadcrumb anchors.
- term: BreadcrumbList
  uri: https://schema.org/BreadcrumbList
  usage: Four-level trail — site, listing type, postcode, property.
- term: ListItem
  uri: https://schema.org/ListItem
