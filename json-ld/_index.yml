observed:
  identifier_scheme: >-
    Listings are identified by an internal reference of the form chpk<digits> embedded in
    the URL path alongside the outward postcode (e.g. /properties-for-sale/br1/chpk3886965).
    There is no RESO UPI, no Ordnance Survey UPRN, and no HM Land Registry title number in
    the published data.
  coverage_note: >-
    The listing corpus is enumerable through the gzipped sitemaps referenced by
    https://www.foxtons.co.uk/sitemap-index.xml (sales, long-lettings, short-lettings,
    offices, blogs, interiors, local-life). Crawling structured data off those pages is
    not an API and Foxtons offers no terms for doing so; the sitemaps are recorded here as
    the shape of the public surface, not as an access grant.
