uk_property_context:
  note: >-
    The interoperability standard that actually moves UK residential listings is the
    Rightmove V3 BLM feed format, a bilateral commercial arrangement between agency CRM
    software and the two portals rather than an open standard anyone can conform to or
    certify against. Foxtons distributes through that route from BOS, its internally built
    CRM/ERP. Nothing about that arrangement is published, so it is recorded as context,
    not as a conformance claim.
