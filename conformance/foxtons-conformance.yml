generated: '2026-07-26'
method: derived
source: >-
  live probes of www.foxtons.co.uk and www.foxtonsgroup.co.uk plus the harvested
  json-ld/ documents, 2026-07-26
note: >-
  Foxtons makes no public conformance claim of any kind — there is no developer surface to
  make one about. Every entry below is either observed in what the site actually serves or
  recorded as a verified absence. No certification is asserted on Foxtons' behalf, and no
  Compliance pointer is wired into apis.yml because no compliance programme is published.
standards:
- id: schema-org
  name: schema.org structured data
  conforms: true
  evidence: >-
    Valid application/ld+json on the homepage (Organization) and on every listing page
    (House/Product + Offer, plus a site @graph with WebSite, RealEstateAgent/LocalBusiness,
    WebPage and BreadcrumbList). Harvested verbatim to json-ld/.
- id: json-ld-1.1
  name: JSON-LD 1.1
  conforms: true
  evidence: >-
    Documents declare "@context": "https://schema.org" and parse as JSON-LD. Foxtons
    inlines the context rather than serving a context document of its own; the derived
    context is at json-ld/foxtons-context.jsonld.
- id: goodrelations
  name: GoodRelations business vocabulary
  conforms: true
  evidence: >-
    offers.businessFunction uses the GoodRelations IRIs
    http://purl.org/goodrelations/v1#Sell and #LeaseOut to distinguish sale from let.
- id: sitemaps-org
  name: sitemaps.org protocol 0.9
  conforms: true
  evidence: >-
    https://www.foxtons.co.uk/sitemap-index.xml (HTTP 200) is a valid sitemapindex with
    lastmod, pointing at gzipped per-section sitemaps.
- id: robots-exclusion
  name: Robots Exclusion Protocol (RFC 9309)
  conforms: true
  evidence: >-
    https://www.foxtons.co.uk/robots.txt (HTTP 200) with Disallow rules and a Sitemap
    directive.
- id: tls-1-3
  name: TLS 1.3
  conforms: true
  evidence: security/foxtons-domain-security.yml — both hosts negotiate TLSv1.3.
- id: hsts
  name: HTTP Strict Transport Security (RFC 6797)
  conforms: true
  evidence: >-
    security/foxtons-domain-security.yml — www.foxtons.co.uk max-age 31536000,
    www.foxtonsgroup.co.uk max-age 15552000.
- id: dmarc
  name: DMARC (RFC 7489)
